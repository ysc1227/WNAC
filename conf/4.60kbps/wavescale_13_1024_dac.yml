$include:
  - conf/base.yml

# SAT/AAR 4.6kbps comparison setting with the DAC/EMAC backbone fixed.
#
# This config intentionally keeps the same convolutional encoder/decoder
# backbone used by DAC/EMAC:
#   encoder_rates = [2, 4, 8, 8], decoder_rates = [8, 8, 4, 2]
# so hop_length = 512 and latent frame rate = 44100 / 512 ~= 86.13 Hz.
#
# With codebook_size=1024 (10 bits/token), a 4.6kbps target requires:
#   effective_scale_sum ~= 4600 / ((44100 / 512) * 10) = 5.3406
#
# Because use_wavescale=True expands base scales as:
#   scale_factor[::-1] + scale_factor[1:]
# this base schedule gives the actual 13-stage schedule:
#   [1.0, 0.645, 0.45, 0.28, 0.17, 0.10, 0.049,
#    0.10, 0.17, 0.28, 0.45, 0.645, 1.0]
# whose sum is 5.339 and bitrate is ~= 4.60kbps.
EMAC.scale_factor: [0.049, 0.10, 0.17, 0.28, 0.45, 0.645, 1.0]
EMAC.use_wavescale: True

# Match SAT/AAR's reported tokenizer codebook size while keeping DAC-style
# backbone controlled for fair comparison.
EMAC.codebook_size: 1024
EMAC.codebook_dim: 64

# DAC/EMAC backbone, not SEANet/SoundStream.
EMAC.encoder_rates: [2, 4, 8, 8]
EMAC.decoder_rates: [8, 8, 4, 2]
EMAC.decoder_dim: 1536
EMAC.depthwise: False
EMAC.noise: False
EMAC.attn_window_size: 32

EMAC.phi_kernel: [9, 9, 9, 9, 9, 9]
EMAC.quantizer_dropout: 0.2
EMAC.quantizer_dropout_mode: symmetric_shell

batch_size: 12
num_iters: 200000
train/AudioDataset.duration: 1.0

lambdas:
  mel/loss: 15.0
  adv/feat_loss: 2.0
  adv/gen_loss: 1.0
  waveform/loss: 0.1
  vq/commitment_loss: 0.25
  vq/codebook_loss: 1.0
  vq/aux_loss: 0.1
