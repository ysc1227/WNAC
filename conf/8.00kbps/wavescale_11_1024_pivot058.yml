$include:
  - conf/8.00kbps/wavescale_13_1024.yml

# Moderate-pivot 11-stage WNAC.
#
# use_wavescale=True expands this base schedule as:
#   [1.00, 0.92, 0.90, 0.82, 0.72, 0.58,
#    0.72, 0.82, 0.90, 0.92, 1.00]
#
# Scale sum remains 9.30, matching the original 13-stage 8kbps token budget:
#   44100 / 512 * 10 * 9.30 ~= 8.01 kbps
#
# The pivot is raised from 0.30 to 0.58 and the number of stages is reduced
# from 13 to 11. This keeps a non-trivial multiscale hierarchy while avoiding
# the aggressive 0.30 bottleneck.
EMAC.scale_factor: [0.58, 0.72, 0.82, 0.90, 0.92, 1.00]
