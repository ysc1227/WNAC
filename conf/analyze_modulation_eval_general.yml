# Temporal modulation analysis over the exported general eval-set folder.

source: folder
input: eval_set/general
output: results/modulation_analysis_general

sample_rate: 44100
hop_length: 512
n_fft: 2048
n_mels: 80
mod_bin_width: 0.1
n_proc: 24
max_files: null

target_sums: [9.0, 9.3]
n_base_scales: 7
recommended_schedule_source: top_q75_equalized
recommended_target_sum: 9.3
make_plots: true

audio_groups:
  - [all, 0.0, 22050.0]
  - [low_0_1k, 0.0, 1000.0]
  - [mid_1_4k, 1000.0, 4000.0]
  - [high_4_12k, 4000.0, 12000.0]
  - [top_12_22k, 12000.0, 22050.0]

schedule_specs:
  - dominant_q80_all_equalized:all:equalized:0.80
  - dominant_q85_all_equalized:all:equalized:0.85
  - balanced_q80_all_energy:all:energy_weighted:0.80
  - high_q80_equalized:high_4_12k:equalized:0.80
  - top_q75_equalized:top_12_22k:equalized:0.75
